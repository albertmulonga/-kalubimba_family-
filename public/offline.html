<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#2563EB"/>
  <title>Hors ligne - Kalubimba Family</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 15%, rgba(59,130,246,.18), transparent 60%),
                  radial-gradient(900px 500px at 80% 15%, rgba(124,58,237,.16), transparent 55%),
                  linear-gradient(135deg, #0B1220 0%, #141B2E 35%, #1B1E3D 100%);
      color: #fff;
      padding: 24px;
      text-align:center;
    }
    .card{
      max-width: 520px;
      width:100%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(10px);
    }
    h1{margin: 12px 0 8px; font-size: 22px;}
    p{margin: 0; opacity:.9; line-height:1.6;}
    img{width:72px; height:72px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/logo.svg" alt="Kalubimba"/>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion Internet, puis réessayez.</p>
  </div>
</body>
</html>
